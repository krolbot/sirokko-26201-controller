services:
  idf:
    image: espressif/idf@sha256:05cbfc42ed2e987b8026722c15bf1d8523d3e4fd1b4ac04d2e4056f5e0918b99
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./firmware:/workspace/firmware
    working_dir: /workspace/firmware
    command: [bash, -c, 'idf.py --version && idf.py --no-ccache reconfigure && cmake --build build --parallel 2']
