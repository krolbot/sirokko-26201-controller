<g fill="none" stroke="#172536"><circle cx="102" cy="128" r="2"/><path d="M98 128H106M102 124V132"/><circle cx="102.25" cy="146.5" r="1"/><path d="M98.25 146.5H106.25M102.25 142.5V150.5"/><circle cx="96" cy="163" r="1"/><path d="M92 163H100M96 159V167"/></g>
</g>
<g font-family="DejaVu Sans, sans-serif" fill="#172536" font-size="2.7">
<text x="30" y="28">PCB-модель: 5207650d…; только проекция TFT/UI.</text>
<text x="30" y="35">Голубой: PCB модуля 62 × 37,25 мм.</text>
<text x="30" y="42">Серый: блок BL 51,20 ±0,10 × 35,70 ±0,10 мм.</text>
<text x="30" y="49" fill="#cf6c06">Оранжевый: предложенное окно 52,0 × 36,5 мм.</text>
<text x="30" y="56">Это полный BL, не активная область A.A. 40,8 × 30,6.</text>
<text x="30" y="63">Точная горизонтальная привязка A.A. не задана.</text>
<text x="30" y="70">Чёрные окружности Ø5: габарит шайб M2.</text>
<text x="30" y="77">Красный пунктир: охват запретных зон R3,6.</text>
<text x="30" y="87" fill="#b21f2d">Допуски привязки BL/сборки и высотный разрез не закрыты.</text>
<text x="30" y="94">±0,10 у окна — назначенный допуск собственной панели.</text>
<text x="30" y="101">Он не является паспортным допуском положения TFT.</text>
<text x="30" y="108">Окно номинально центрировано по BL; X отражён относительно A-side.</text>
<text x="30" y="115">Фиолетовый — J26; зелёный — проекция колпачка ПУСК/СТОП.</text>
<text x="139" y="133">ЭНКОДЕР</text><path d="M153 134L165 137" stroke="#172536" fill="none" stroke-width="0.25"/>
<text x="128" y="159">ПУСК/СТОП</text><path d="M150 158L161 156.5" stroke="#172536" fill="none" stroke-width="0.25"/>
<text x="152" y="184">RESET</text><path d="M165 182L173 175" stroke="#172536" fill="none" stroke-width="0.25"/>
<text x="198" y="154" font-size="3.3">GMT020-02-7P</text><text x="207" y="160">БЛОК BL</text>
<text x="207" y="127" font-size="2.5">52,0 ±0,10</text>
<text x="250" y="143" font-size="2.5" transform="rotate(90 250 143)">36,5 ±0,10</text>
<text x="25" y="194">Центр окна в CAD: (55,80;143,55) мм. Энкодер (102;128); ПУСК/СТОП (102,25;146,50); RESET (96;163).</text>
<text x="25" y="198">Пока не использовать для изготовления корпуса. Отверстия органов управления здесь не квалифицированы.</text>
<text x="25" y="204">Печать 100%, без подгонки. Контрольный отрезок справа: 50 мм.</text>
</g>
