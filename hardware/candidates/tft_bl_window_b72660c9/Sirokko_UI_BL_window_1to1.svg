<g font-family="DejaVu Sans, sans-serif" fill="#172536"><text x="10" y="7" font-size="3.5">SIROKKO — TFT и органы управления, вид с B-side, 1:1</text><text x="10" y="13" font-size="2.8" fill="#b21f2d">DRAFT / NOT FOR ORDER — номинальный план, НЕ шаблон сверления корпуса</text></g>
<!-- Drawing u,v to native PCB: X=87-v, Y=162.25-u; PCB to sheet: x=270-X,y=Y+10. -->
