<svg xmlns="http://www.w3.org/2000/svg" width="260mm" height="135mm" viewBox="0 0 260 135">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#333"/></marker>
    <style>
      text{font-family:DejaVu Sans,Arial,sans-serif;fill:#111;font-size:3px}
      .title{font-size:5px;font-weight:bold}.sub{font-size:3.2px;font-weight:bold}
      .pcb{fill:#2f855a}.panel{fill:#999}.part{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:.3}
      .warn{fill:#fff7ed;stroke:#c2410c;stroke-width:.35}.dim{stroke:#333;stroke-width:.25;marker-start:url(#arr);marker-end:url(#arr)}
      .guide{stroke:#888;stroke-width:.2;stroke-dasharray:1,1}.small{font-size:2.5px}.red{fill:#b91c1c;font-weight:bold}
    </style>
  </defs>
  <rect x="0" y="0" width="260" height="135" fill="white"/>
  <text class="title" x="5" y="7">SIROKKO — единая высотная цепь операторской стороны</text>
  <text x="5" y="12">База z=0: наружная поверхность B-side основной PCB. Наружу к оператору — +z.</text>

  <!-- Common section datum -->
  <rect class="pcb" x="8" y="96" width="244" height="4"/>
  <line x1="8" y1="96" x2="252" y2="96" stroke="#b91c1c" stroke-width="0.45"/>
  <text class="red" x="8" y="94">Z0</text>
  <text x="10" y="104">Основная PCB 1.6 мм; z=0 на наружной поверхности, показана условно</text>
  <rect class="panel" x="8" y="70" width="244" height="5"/>
  <rect x="68" y="62" width="87" height="7" fill="white"/>
  <text class="sub" x="70" y="67">PANEL: z=8.0±0.2 мм; t=1.5±0.2 мм</text>

  <!-- Encoder -->
  <g transform="translate(20,0)">
    <rect class="part" x="0" y="82.5" width="28" height="13.5"/>
    <rect class="part" x="11" y="22.5" width="6" height="60"/>
    <line class="dim" x1="32" y1="96" x2="32" y2="22.5"/>
    <text class="sub" x="0" y="18">ENC J23</text>
    <text x="35" y="50">24.5 nominal</text>
    <text x="35" y="54">до торца</text>
    <text x="0" y="108">Alps EC11E15244G1</text>
    <text class="small" x="0" y="112">верх корпуса z=4.5; торец z=24.5</text>
    <text class="small" x="0" y="116">нажат: z=24.0 nominal; ход 0.5</text>
    <text class="small" x="0" y="120">панель: отверстие Ø6.5</text>
  </g>

  <!-- Start/Stop -->
  <g transform="translate(82,0)">
    <rect class="part" x="0" y="74.8" width="32" height="21.2"/>
    <line class="guide" x1="16" y1="66" x2="16" y2="96"/>
    <line class="dim" x1="36" y1="96" x2="36" y2="66"/>
    <text class="sub" x="0" y="18">ПУСК/СТОП J22</text>
    <text x="39" y="80">10.0±0.4</text>
    <text x="39" y="84">до верха cap</text>
    <text x="0" y="108">Omron B3F-4055 + B32-1380</text>
    <text class="small" x="0" y="112">нажатый минимум: 10.0−0.4−0.5=9.1</text>
    <text class="small" x="0" y="116">при zпанели=8.0: выступ 2.0 nominal</text>
    <text class="small" x="0" y="120">в нажатом худшем случае ≥1.1 мм</text>
  </g>

  <!-- Reset -->
  <g transform="translate(146,0)">
    <rect class="part" x="0" y="84" width="30" height="12"/>
    <line class="part" x1="15" y1="84" x2="15" y2="56.7" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M15 84 L26.5 59.5" fill="none" stroke="#1d4ed8" stroke-width="2" opacity=".45"/>
    <text class="sub" x="0" y="18">RESET J24</text>
    <text x="0" y="108">NKK BB25AB-FA</text>
    <text class="small" x="0" y="112">A-toggle 10.0; throw ±26°</text>
    <text class="small" x="0" y="116">13.1: размер на drawing</text>
    <text class="small red" x="0" y="120">паз 6×12: SAMPLE CHECK</text>
  </g>

  <!-- TFT uncertain chain -->
  <g transform="translate(196,0)">
    <rect class="part" x="0" y="82" width="54" height="14"/>
    <rect class="part" x="4" y="61" width="46" height="21"/>
    <line class="dim" x1="53" y1="96" x2="53" y2="61"/>
    <text class="sub" x="0" y="18">TFT MH5/J26</text>
    <rect class="warn" x="0" y="22" width="54" height="31"/>
    <text class="red" x="2" y="27">TFT z_front / WINDOW: HOLD</text>
    <text class="small" x="2" y="32">z_front = H_socket + H_module</text>
    <text class="small" x="2" y="36">outline 37.25×62.00×12.10 max</text>
    <text class="small" x="2" y="40">12.10 max нельзя складывать</text>
    <text class="small" x="2" y="44">с socket без общей базы.</text>
    <text class="small red" x="2" y="48">Измерить TFT+J26+4×M2.</text>
    <text class="small red" x="2" y="52">WINDOW NOT RELEASED</text>
    <text class="small" x="0" y="108">J26 direct; 4×Ø2.70</text>
    <text class="small red" x="0" y="112">window/step — HOLD</text>
    <text class="small" x="0" y="116">measure z_front and A.A.</text>
  </g>

  <rect x="60" y="62" width="95" height="7" fill="white"/>
  <text class="sub" x="62" y="67">PANEL: z=8.0±0.2 мм; t=1.5±0.2 мм</text>
  <text class="red" x="5" y="129">Вывод: органы управления согласуются с локальной плоскостью z=8 мм.</text>
  <text class="small red" x="5" y="133">TFT: отдельная ступень после контрольной сборки; плоскую общую панель до измерений не выпускать.</text>
</svg>
