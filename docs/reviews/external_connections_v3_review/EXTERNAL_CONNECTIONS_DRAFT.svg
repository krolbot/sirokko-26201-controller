<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 700 640"><rect width="700" height="640" fill="white" /><text x="20" y="24" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#222">SIROKKO — внешние подключения / V3</text><text x="20" y="45" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#b00000">DRAFT / NOT FOR ORDER / NO POWER / NO FIRE</text><text x="20" y="63" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">Логическая схема. Не физическая раскладка. Цвета линий не задают цвета проводов.</text><rect x="238" y="82" width="224" height="490" rx="8" fill="#eff6ec" stroke="#3f6538" stroke-width="1.5" /><text x="279" y="103" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#2c5028">ПЛАТА SIROKKO</text><rect x="15" y="116" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="23" y="133" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Термопара K №1</text><text x="23" y="150" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: T+</text><text x="23" y="163" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: T−</text><path d="M200 157 H238" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="247" y="152" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J10</text><text x="247" y="167" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">2 конт.</text><rect x="15" y="226" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="23" y="243" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Термопара K №2</text><text x="23" y="260" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: T+</text><text x="23" y="273" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: T−</text><path d="M200 267 H238" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="247" y="262" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J11</text><text x="247" y="277" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">2 конт.</text><rect x="15" y="336" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="23" y="353" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Датчик DS18B20</text><text x="23" y="370" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: VDD +3,3 В</text><text x="23" y="383" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: DQ</text><text x="23" y="396" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">3: GND</text><path d="M200 377 H238" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="247" y="372" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J12</text><text x="247" y="387" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">3 конт.</text><rect x="15" y="446" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="23" y="463" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Источник 24 В DC</text><text x="23" y="480" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: +24 В</text><text x="23" y="493" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: GND / 0 В</text><path d="M200 487 H238" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="247" y="482" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J13</text><text x="247" y="497" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">2 конт.</text><rect x="500" y="116" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="508" y="133" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Свеча</text><text x="508" y="150" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: переключаемый +</text><text x="508" y="163" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: GND</text><path d="M462 157 H500" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="402" y="152" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J27</text><text x="401" y="167" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">2 конт.</text><rect x="500" y="226" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="508" y="243" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Электромуфта</text><text x="508" y="260" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: переключаемый +</text><text x="508" y="273" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: GND</text><path d="M462 267 H500" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="402" y="262" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J28</text><text x="401" y="277" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">2 конт.</text><rect x="500" y="336" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="508" y="353" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Двигатель 24 В</text><text x="508" y="370" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: PWM+</text><text x="508" y="383" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: GND</text><path d="M462 377 H500" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="402" y="372" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J102</text><text x="401" y="387" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">2 конт.</text><rect x="500" y="446" width="185" height="86" rx="4" fill="#f5f5f5" stroke="#777" stroke-width="0.8" /><text x="508" y="463" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#222">Внешний интерфейс</text><text x="508" y="480" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">1: +3,3 В — выход питания</text><text x="508" y="493" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">2: THERMAL_OK — вход</text><text x="508" y="506" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">3: GND</text><text x="508" y="519" font-family="DejaVu Sans,sans-serif" font-size="9.4" fill="#222">4: SAFETY_OK — выход</text><path d="M462 487 H500" stroke="#385c8a" stroke-width="1.5" fill="none" /><text x="402" y="482" font-family="DejaVu Sans,sans-serif" font-size="12" fill="#183c68">J25</text><text x="401" y="497" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">4 конт.</text><text x="276" y="162" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">U9 / MAX31856</text><text x="276" y="183" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">K, 0…600 °C</text><text x="276" y="270" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">U10 / MAX31856</text><text x="276" y="381" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">1-Wire / 3,3 В</text><text x="276" y="488" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">F1 → защита</text><text x="276" y="505" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">от переполюсовки</text><text x="276" y="522" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">→ питание / нагрузки</text><text x="355" y="186" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">K1</text><text x="355" y="296" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">K2 → K3</text><text x="355" y="406" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#222">ШИМ</text><text x="280" y="553" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#b00000">J25 — только логика 3,3 В</text><text x="20" y="595" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#b00000">Не подавать 24 В на J12/J25. J25.4 — выход: внешнее напряжение к нему запрещено.</text><text x="20" y="612" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#222">Нумерация — по площадкам PCB, не «слева направо». Полярность термопар не определять по цвету.</text><text x="20" y="629" font-family="DejaVu Sans,sans-serif" font-size="9" fill="#b00000">PCB V3: 121 незавершённое соединение, 84 предупреждения. Силовые токи и стенд ещё не приняты.</text></svg>