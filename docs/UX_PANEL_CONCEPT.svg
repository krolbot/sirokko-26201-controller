<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">
<rect width="1000" height="900" fill="#fafafa"/>
<g font-family="DejaVu Sans, sans-serif" fill="#20272b">
<text x="30" y="42" font-size="25" font-weight="bold">Sirokko · концепция управления в корпусе</text>
<text x="30" y="66" font-size="16">Предложение для UX-проверки, не утверждённая раскладка PCB</text>
<rect x="30" y="85" width="940" height="715" rx="14" fill="#e9ecec" stroke="#899496" stroke-width="2"/>
<rect x="150" y="122" width="600" height="300" rx="5" fill="#152329" stroke="#46565b" stroke-width="5"/>
<g fill="#f3f7f7">
<text x="178" y="166" font-size="25">ПРОДУВКА · пуск запрещён</text>
<text x="178" y="204" font-size="21">Дождитесь завершения продувки</text>
<text x="178" y="252" font-size="19">Помещение</text><text x="472" y="252" font-size="19">Уставка</text>
<text x="178" y="305" font-size="43">— °C</text><text x="472" y="305" font-size="43">— °C</text>
<text x="178" y="365" font-size="20">Причина запрета всегда видна</text>
<text x="178" y="399" font-size="17" fill="#a5bdc5">МАКЕТ · значения не измерены</text>
</g>
<rect x="777" y="122" width="156" height="126" rx="8" fill="none" stroke="#6e7879" stroke-width="7"/>
<rect x="789" y="134" width="132" height="102" rx="5" fill="#f9f9f6" stroke="#626b6e" stroke-width="2"/>
<text x="855" y="175" font-size="18" text-anchor="middle" font-weight="bold">СБРОС</text><text x="855" y="201" font-size="18" text-anchor="middle" font-weight="bold">ЗАЩИТЫ</text>
<text x="855" y="275" font-size="14" text-anchor="middle">Отдельная зона</text><text x="855" y="297" font-size="14" text-anchor="middle">с защитой от</text><text x="855" y="319" font-size="14" text-anchor="middle">случайного нажатия</text>
<text x="150" y="455" font-size="17">Настройка и навигация — без скрытого пуска</text>
<g fill="#fcfcfc" stroke="#637075" stroke-width="2">
<rect x="150" y="475" width="180" height="85" rx="9"/><rect x="360" y="475" width="85" height="85" rx="9"/>
<rect x="475" y="475" width="85" height="85" rx="9"/><rect x="590" y="475" width="160" height="85" rx="9"/>
</g>
<text x="240" y="509" font-size="20" text-anchor="middle">МЕНЮ</text><text x="240" y="540" font-size="20" text-anchor="middle">НАЗАД</text>
<text x="402" y="533" font-size="45" text-anchor="middle">−</text><text x="517" y="533" font-size="45" text-anchor="middle">+</text><text x="670" y="531" font-size="30" text-anchor="middle">OK</text>
<rect x="150" y="615" width="245" height="110" rx="12" fill="#f4faf6" stroke="#347054" stroke-width="4"/>
<text x="272" y="664" font-size="32" text-anchor="middle" font-weight="bold">ПУСК</text><text x="272" y="699" font-size="16" text-anchor="middle">Осознанный запуск</text>
<rect x="505" y="615" width="245" height="110" rx="12" fill="#fff7f5" stroke="#a74736" stroke-width="4"/>
<text x="627" y="664" font-size="32" text-anchor="middle" font-weight="bold">СТОП</text><text x="627" y="699" font-size="16" text-anchor="middle">С любой страницы</text>
<text x="150" y="766" font-size="17">Останов: топливо выключается, затем продолжается продувка.</text>
<text x="30" y="839" font-size="18" font-weight="bold">6 основных кнопок + отдельный сброс защиты — предложение, не жёсткое число.</text>
<text x="30" y="870" font-size="17">Форма корпуса, масштаб, размеры и окончательные компоненты здесь не заданы.</text>
<text x="30" y="893" font-size="14">Не размерный чертёж. Эргономика реального прибора ещё не проверена.</text>
