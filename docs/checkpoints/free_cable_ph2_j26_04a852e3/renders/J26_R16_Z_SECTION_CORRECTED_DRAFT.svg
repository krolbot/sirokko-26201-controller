<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188">
<title>Sirokko — исправленный разрез J26 и выводов R16, DRAFT</title>
<desc>Геометрическая схема по PCB 4fe3df0d. B-поверхность носителя Z=0, отрицательное Z к экрану; z_local(исходный)=−z_world. J26 и выступающие выводы R16 с припоем расположены с одной B-стороны. Минимальный расчётный зазор 0,20 мм условен при контролируемых g не менее 0,70 мм и p не более 0,50 мм. Не производственный допуск.</desc>
<defs>
 <pattern id="pcbHatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#dcefe3"/><line x1="0" y1="0" x2="0" y2="16" stroke="#8bb398" stroke-width="3"/></pattern>
 <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a92929"/></marker>
 <style>
 text{font-family:DejaVu Sans,sans-serif;fill:#19232b} .title{font-size:32px;font-weight:bold} .head{font-size:25px;font-weight:bold} .txt{font-size:22px} .small{font-size:19px} .tiny{font-size:17px} .red{fill:#a92929} .dim{stroke:#a92929;stroke-width:2;fill:none} .guide{stroke:#55616c;stroke-width:1.5;stroke-dasharray:8 5;fill:none} .solid{stroke:#23333e;stroke-width:2;fill:none} .warn{fill:#fff1d5;stroke:#ba8231;stroke-width:2}
 </style>
</defs>
<rect width="1680" height="1188" fill="white"/>
<text x="60" y="62" class="title">Sirokko — J26 / R16: исправленный монтажный разрез</text>
<rect x="60" y="86" width="1560" height="48" fill="#fff1d5" stroke="#ba8231"/>
<text x="80" y="118" class="txt red">DRAFT · NOT FOR ORDER · NO POWER · NO FIRE · СХЕМА НЕ В МАСШТАБЕ</text>
<text x="60" y="170" class="small">Основание: конечная PCB 4fe3df0d…; текущий g=0,80±0,10 мм. Геометрия PCB этим листом не изменяется.</text>

<text x="80" y="224" class="head">А–А: X–Z, сечение по world Y=110,00 мм</text>
<text x="80" y="257" class="small">Две оси выводов R16 находятся под XY-проекцией корпуса J26.</text>
<text x="80" y="290" class="small">F-сторона: корпус R16 здесь не размерен и условно не показан.</text>

<rect x="100" y="350" width="940" height="64" fill="url(#pcbHatch)" stroke="#245c39" stroke-width="3"/>
<line x1="520.8" y1="319" x2="520.8" y2="434" stroke="#a46b16" stroke-width="9"/>
<line x1="927.2" y1="319" x2="927.2" y2="434" stroke="#a46b16" stroke-width="9"/>
<rect x="504.8" y="414" width="32" height="20" fill="#e5b965" stroke="#a46b16" stroke-width="1.5"/>
<rect x="911.2" y="414" width="32" height="20" fill="#e5b965" stroke="#a46b16" stroke-width="1.5"/>
<text x="462" y="311" class="small">R16.1</text>
<text x="869" y="311" class="small">R16.2</text>
<text x="120" y="390" class="txt">Плата-носитель</text>
<line x1="100" y1="414" x2="1040" y2="414" stroke="#16456e" stroke-width="3"/>

<text x="105" y="338" class="small">F: Z=+1,60 мм, номинально</text>

<rect x="150" y="446" width="812.8" height="101.6" fill="#d7c2e9" stroke="#704399" stroke-width="2.5"/>
<line x1="150" y1="442" x2="962.8" y2="442" stroke="#a92929" stroke-width="2" stroke-dasharray="10 6"/>
<text x="183" y="486" class="txt">J26 · Harwin M20-9960845 · B-сторона</text>
<text x="183" y="521" class="small">Корпус: номинальная оболочка; выводы J26 вне А–А</text>
<line x1="150" y1="566" x2="962.8" y2="566" class="guide"/>
<text x="183" y="596" class="small">X корпуса: 135,73…156,05 мм; его ряд THT — по Y=114,50 мм.</text>
<text x="183" y="628" class="small">R16.1: X=145,00 мм; R16.2: X=155,16 мм; обе оси Y=110,00 мм.</text>
<text x="183" y="660" class="small">Золотистый контур — условный габарит хвоста с припоем, не форма пайки.</text>
<line x1="75" y1="430" x2="75" y2="552" class="dim" marker-end="url(#arrow)"/>
<text x="58" y="585" class="txt red">−Z</text>
<text x="58" y="613" class="tiny">к TFT</text>

<line x1="1110" y1="204" x2="1110" y2="686" stroke="#ccd1d5" stroke-width="2"/>
<text x="1140" y="225" class="head">Базы и условия</text>
<text x="1140" y="267" class="txt">g: от B-поверхности носителя</text>
<text x="1140" y="299" class="txt">до ближайшей грани J26.</text>
<text x="1140" y="343" class="txt">p: хвост R16 + припой</text>
<text x="1140" y="375" class="txt">от той же B-поверхности.</text>
<text x="1140" y="419" class="txt">И J26, и p — со стороны B.</text>
<text x="1140" y="463" class="txt">g = 0,70…0,90 мм</text>
<text x="1140" y="495" class="txt">p ≤ 0,50 мм</text>
<text x="1140" y="539" class="txt">Толщина PCB:</text>
<text x="1140" y="571" class="txt">1,60±0,16 мм</text>
<text x="1140" y="615" class="small">g и p — сборочные требования,</text>
<text x="1140" y="645" class="small">не результаты измерений.</text>
<text x="1140" y="675" class="small">База B: Z=0; −Z — к TFT.</text>

<rect x="60" y="704" width="1030" height="358" rx="8" fill="#f4f7fa" stroke="#c5cdd5"/>
<text x="80" y="743" class="head">Б: увеличенная предельная цепь, g минимально / p максимально</text>
<rect x="110" y="755" width="510" height="35" fill="url(#pcbHatch)" stroke="#245c39" stroke-width="2"/>
<line x1="110" y1="790" x2="620" y2="790" stroke="#16456e" stroke-width="3"/>
<text x="130" y="779" class="small">носитель</text>
<rect x="330" y="790" width="45" height="100" fill="#e5b965" stroke="#a46b16" stroke-width="2"/>
<rect x="110" y="930" width="510" height="65" fill="#d7c2e9" stroke="#704399" stroke-width="2"/>
<text x="130" y="973" class="txt">J26 при g=0,70 мм</text>
<line x1="275" y1="790" x2="275" y2="890" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="424" y1="890" x2="424" y2="930" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="653" y1="790" x2="653" y2="930" class="dim" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="375" y1="890" x2="470" y2="890" class="guide"/>
<text x="120" y="844" class="small red">pmax=0,50</text>
<text x="452" y="916" class="small red">cmin=0,20</text>
<text x="677" y="802" class="small red">gmin=0,70 мм</text>
<text x="677" y="830" class="txt">c = g − p</text>
<text x="677" y="873" class="txt">0,70 − 0,50 = 0,20 мм</text>
<text x="677" y="921" class="small">При номинальном g=0,80:</text>
<text x="677" y="953" class="small">c=0,30 мм для p=0,50.</text>
<text x="80" y="1036" class="small">Штриховая грань в А–А — предельное приближение корпуса, а не вторая деталь.</text>

<rect x="1125" y="704" width="495" height="358" rx="8" class="warn"/>
<text x="1145" y="743" class="head">Собственный хвост J26</text>
<text x="1145" y="785" class="small">Выходит на F-сторону носителя:</text>
<text x="1145" y="823" class="small">min: 2,75 − 1,76 − 0,90 = 0,09 мм</text>
<text x="1145" y="859" class="small">max: 3,25 − 1,44 − 0,70 = 1,11 мм</text>
<text x="1145" y="903" class="txt red">Это НЕ «IPC PASS».</text>
<text x="1145" y="941" class="small">Технология пайки и её контроль</text>
<text x="1145" y="973" class="small">должны быть квалифицированы.</text>
<text x="1145" y="1021" class="small">Не путать с B-хвостами R16!</text>

<line x1="60" y1="1090" x2="1620" y2="1090" stroke="#8e999f" stroke-width="2"/>
<text x="60" y="1124" class="small">Исправлено только изображение сторон и размерных баз. Полная кабельная трасса, Z-сборка и пайка этим листом не приняты.</text>
<text x="60" y="1157" class="small">Расчёт: gmin−pmax. Доказательства: PCB4fe3, DRG-00475, монтажный контракт run307. Физические испытания не выполнялись.</text>
</svg>
