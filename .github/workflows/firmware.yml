name: Firmware checks

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: firmware/web_ui/package-lock.json
      - name: Check optional Wi-Fi password behavior
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror firmware/tests/wifi_password_test.cpp -o /tmp/sirokko-wifi-test
          /tmp/sirokko-wifi-test
          node --test firmware/web_ui/tests/wifi.test.mjs
      - name: Build production web page and verify embedded bytes
        run: |
          npm ci --prefix firmware/web_ui
          npm run build --prefix firmware/web_ui
          python3 firmware/tools/embed_web_ui.py --check
      - name: ESP-IDF v5.2.3 ESP32-S3 target build
        run: |
          docker run --rm \
            -e IDF_TARGET=esp32s3 \
            -e IDF_COMPONENT_MANAGER=1 \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/firmware \
            espressif/idf@sha256:9cd723f013e1a8b22aeed61c02e3248bb11e8f2e2ae333cee08a18b9e36c1380 \
            /bin/bash -lc 'git config --global --add safe.directory "*" && idf.py --version && idf.py set-target esp32s3 && idf.py build'
      - name: Prepare complete ESP32-S3 flash artifact
        run: |
          mkdir -p firmware/release-artifact/bootloader firmware/release-artifact/partition_table
          cp \
            firmware/build/sirokko_26201_controller.bin \
            firmware/build/ota_data_initial.bin \
            firmware/build/flash_args \
            firmware/build/flasher_args.json \
            firmware/build/project_description.json \
            firmware/build/config/sdkconfig.json \
            firmware/dependencies.lock \
            firmware/release-artifact/
          cp firmware/build/bootloader/bootloader.bin firmware/release-artifact/bootloader/
          cp firmware/build/partition_table/partition-table.bin firmware/release-artifact/partition_table/
          printf '%s\n' "$GITHUB_SHA" > firmware/release-artifact/GIT_COMMIT
          printf '%s\n' 'ESP-IDF v5.2.3 / espressif/idf linux-amd64 sha256:9cd723f013e1a8b22aeed61c02e3248bb11e8f2e2ae333cee08a18b9e36c1380' > firmware/release-artifact/BUILD_ENVIRONMENT
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("firmware/release-artifact").resolve()
          flash_files = json.loads((root / "flasher_args.json").read_text())["flash_files"]
          for offset, relative in flash_files.items():
              image = (root / relative).resolve()
              if root not in image.parents or not image.is_file():
                  raise SystemExit(f"unresolved flash image {offset}: {relative}")
              print(f"{offset} {relative}")
          PY
          (cd firmware/release-artifact && sha256sum \
            BUILD_ENVIRONMENT GIT_COMMIT dependencies.lock flash_args flasher_args.json \
            ota_data_initial.bin project_description.json sdkconfig.json \
            bootloader/bootloader.bin partition_table/partition-table.bin \
            sirokko_26201_controller.bin > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sirokko-esp32s3-${{ github.sha }}
          path: firmware/release-artifact/
          if-no-files-found: error
          retention-days: 30
